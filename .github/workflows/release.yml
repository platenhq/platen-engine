name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # When a release PR is merged and a new release is created:
      - name: Checkout repository
        uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Automatically appends Installation & Helpful Links to the release notes:
      - name: Append Release Notes Template
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          ORIGINAL_BODY: ${{ steps.release.outputs.body }}
        run: |
          cat << 'EOF' > template_footer.md

          ---
          ### 📦 Installation

          ```bash
          npm install @platen/engine
          ```

          ---
          ### 🔗 Helpful Links & Documentation

          - 📖 **Documentation**: [Platen Architecture & Guide](https://github.com/platenhq/platen-engine#readme)
          - 📦 **NPM Registry**: [@platen/engine](https://www.npmjs.com/package/@platen/engine)
          - 🐛 **Issue Tracker**: [Report an Issue or Request Feature](https://github.com/platenhq/platen-engine/issues)
          - 💬 **Discussions**: [Community Discussions](https://github.com/platenhq/platen-engine/discussions)
          EOF

          echo "$ORIGINAL_BODY" > full_notes.md
          cat template_footer.md >> full_notes.md
          gh release edit "$TAG" --notes-file full_notes.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Build package distribution
        run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - name: Publish to npm (OIDC Provenance)
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
