name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'major'
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
  - title: '🧰 Maintenance & CI'
    labels:
      - 'chore'
      - 'ci'
      - 'docs'
      - 'documentation'
      - 'test'

change-template: '- $TITLE (@$AUTHOR in #$NUMBER)'

change-title-escapes: '\<*_&'

autolabeler:
  - label: 'breaking'
    title:
      - '/^break/i'
      - '/breaking/i'
  - label: 'feat'
    title:
      - '/^feat(\(.*\))?:/i'
      - '/^feature(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
      - '/^bug(\(.*\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
  - label: 'test'
    title:
      - '/^test(\(.*\))?:/i'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
      - 'feature'
      - 'feat'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
      - 'docs'
      - 'ci'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  ---
  ### 📦 Installation

  ```bash
  npm install @platen/engine
  ```

  ---
  ### 🔗 Helpful Links & Documentation

  - 📖 **Documentation**: [Platen Architecture & Guide](https://github.com/platenhq/platen-engine#readme)
  - 📦 **NPM Registry**: [@platen/engine](https://www.npmjs.com/package/@platen/engine)
  - 🐛 **Issue Tracker**: [Report an Issue or Request Feature](https://github.com/platenhq/platen-engine/issues)
  - 💬 **Discussions**: [Community Discussions](https://github.com/platenhq/platen-engine/discussions)

  ---
  **Full Changelog**: https://github.com/platenhq/platen-engine/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

  ### 👥 Contributors
  $CONTRIBUTORS
